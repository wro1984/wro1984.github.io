<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB · Centro de Operações</title>
<meta name="description" content="Os apps do Centro de Operações em um só lugar: entre uma vez e abra os apps liberados para você.">
<meta name="theme-color" content="#642A90">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HUB">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  /* paleta da empresa (a mesma dos apps) */
  --roxo:#642A90; --verdeB:#99CC33; --laranja:#FF9901; --rosa:#EC357D;
  --p50:#f6f1fa; --p100:#ebe0f4; --p200:#d5bfe7; --p300:#b48fd3; --p500:#8549b5; --p700:#642A90; --p800:#52227a; --p900:#3a1658;
  --bg:#F4F0F9; --card:#fff; --ink:#1f1530; --ink2:#5b5068; --ink3:#8a7f99; --line:#e6e0ee; --bad:#c41a60; --badbg:#fde6ef;
  --r:20px; --sh:0 1px 3px rgba(58,22,88,.05),0 10px 28px rgba(58,22,88,.09);
  /* A2 moderno: vidro sobre fundo com brilho roxo */
  --glass:rgba(255,255,255,.78); --campo:#fff; --borda:rgba(100,42,144,.14); --linha:rgba(100,42,144,.1);
  --acento:#642A90; --brilho:0 6px 16px rgba(100,42,144,.28); --abaon:#fff; --abatx:#3a1658; --estrela:#FF9901;
  --fundo:radial-gradient(90% 50% at 100% 0%,#E4D6F3 0%,transparent 62%),radial-gradient(70% 45% at 0% 78%,#F5E6F0 0%,transparent 62%);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#120A1A; --card:#221832; --ink:#F3EDFA; --ink2:#C9BCD8; --ink3:#9a8eb0; --line:#352849; --bad:#ff6fa5; --badbg:#3f1226;
    --sh:0 1px 0 rgba(255,255,255,.04) inset,0 10px 28px rgba(0,0,0,.38);
    --glass:rgba(255,255,255,.07); --campo:rgba(255,255,255,.08); --borda:rgba(255,255,255,.13); --linha:rgba(255,255,255,.09);
    --acento:#C6A3E8; --brilho:0 6px 18px rgba(133,73,181,.45); --abaon:rgba(255,255,255,.16); --abatx:#fff;
    --fundo:radial-gradient(90% 50% at 100% 0%,#43246a 0%,transparent 62%),radial-gradient(70% 45% at 0% 78%,#2c1233 0%,transparent 62%); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip}
body{background:transparent;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--fundo),var(--bg);pointer-events:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--p300);outline-offset:2px}
[hidden]{display:none !important}
.vidro{background:var(--glass);border:1px solid var(--borda);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

/* marca (entrada) */
.marca{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:750;letter-spacing:-.3px}
.marca .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p500),var(--p700));display:grid;place-items:center;
  box-shadow:var(--brilho);flex:none}
.marca .logo svg{width:22px;height:22px}
header.top{padding:calc(18px + var(--safe-t)) 20px 0;max-width:640px;margin:0 auto}

main{max-width:640px;margin:0 auto;padding:18px 20px calc(28px + var(--safe-b))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px 20px}

/* entrada */
#login .card{margin-top:6vh}
#login h2{margin:0 0 4px;font-size:22px}
#login p.lead{margin:0 0 18px;color:var(--ink2)}
label.campo{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 6px}
input.txt{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:16px}
input.txt:focus{outline:none;border-color:var(--p500);box-shadow:0 0 0 3px rgba(133,73,181,.18)}
.ver{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-top:8px;cursor:pointer}
.ver input{width:auto}
.btn{width:100%;margin-top:18px;padding:14px;border-radius:14px;border:0;background:var(--p700);color:#fff;font-weight:700;font-size:16px}
.btn:disabled{opacity:.6;cursor:default}
.erro{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.ajuda{font-size:13px;color:var(--ink3);margin-top:14px;line-height:1.5}

/* tela dos apps: no celular uma coluna; a partir de 900 px vira barra no topo + tabela */
#hub{max-width:640px;margin:0 auto}
.topo{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"saud conta" "busca busca" "abas abas";gap:12px 14px;align-items:center}
.topo .marca{grid-area:marca;display:none}
.saud{grid-area:saud;min-width:0}
.saud small{display:block;font-size:13px;color:var(--ink2)}
.saud h2{margin:0;font-size:26px;font-weight:750;letter-spacing:-.5px;line-height:1.15;overflow-wrap:anywhere}
.conta-box{grid-area:conta;position:relative;display:flex;align-items:center;gap:12px}
.conta-nome{display:none;text-align:right;font-size:13px;line-height:1.35}
.conta-nome span{display:block;color:var(--ink2)}
.avatar{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px}
.busca{grid-area:busca;position:relative}
.busca svg{position:absolute;left:18px;top:50%;margin-top:-9px;width:18px;height:18px;pointer-events:none;color:var(--ink2)}
.busca input{width:100%;height:50px;padding:0 18px 0 46px;border-radius:25px;font-size:16px;border:1px solid var(--borda);background:var(--campo)}
.busca input::placeholder{color:var(--ink2);opacity:.75}
.busca input:focus{outline:2px solid var(--p300);outline-offset:2px}
.abas{grid-area:abas;display:flex;padding:4px;border-radius:26px;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.abas::-webkit-scrollbar{display:none}
.aba{flex:1 0 auto;min-height:44px;border:0;border-radius:22px;background:transparent;color:var(--ink2);font-size:13.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.aba[aria-selected="true"]{background:var(--abaon);color:var(--abatx);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.aba .n{font-size:11.5px;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--campo);color:var(--ink)}
.aba[aria-selected="true"] .n{background:var(--p500);color:#fff}

.conta-pop{position:absolute;top:calc(100% + 8px);right:0;z-index:20;width:min(300px,calc(100vw - 40px));padding:16px;border-radius:20px;
  background:var(--card);border:1px solid var(--borda);box-shadow:var(--sh);display:flex;flex-direction:column;gap:10px}
.conta-pop b{font-size:15px}
.conta-pop .meta{font-size:13px;color:var(--ink2);line-height:1.5}
.conta-pop button{min-height:44px;border-radius:14px;border:1px solid var(--borda);background:transparent;font-weight:600}
.conta-pop button.sair{background:var(--badbg);color:var(--bad);border-color:transparent}

.corpo{display:flex;flex-direction:column;gap:20px;margin-top:18px}
.fixados h3,.fixados-t{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink2)}
.fix-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
a.fix{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:20px;color:inherit;text-decoration:none;
  font-size:12.5px;font-weight:600;text-align:center;line-height:1.2;transition:transform .15s}
a.fix:active{transform:scale(.97)}
a.fix .app-ic{width:56px;height:56px;border-radius:18px;font-size:30px}

.lista{display:flex;flex-direction:column;border-radius:24px;overflow:hidden}
.lista-cab{display:none}
.item{display:flex;align-items:center;border-top:1px solid var(--linha)}
.item:first-of-type{border-top:0}
a.linha{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 4px 10px 14px;min-height:62px;color:inherit;text-decoration:none}
a.linha:active{background:var(--linha)}
.app-ic{width:44px;height:44px;border-radius:14px;background:var(--p100);display:grid;place-items:center;font-size:24px;flex:none;box-shadow:var(--brilho)}
.app-ic.com-img{background:transparent;overflow:hidden}
.app-ic img{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-color-scheme: dark){.app-ic:not(.com-img){background:#33244a}}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx .nome{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.tx .nome i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.tx .desc{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grupo,.abrir{display:none}
.estrela{width:48px;height:62px;border:0;background:transparent;display:grid;place-items:center;flex:none;padding:0;color:var(--ink2)}
.estrela svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.estrela[aria-pressed="true"]{color:#FFB84D}
.estrela[aria-pressed="true"] svg{fill:var(--estrela)}
.sem{padding:28px 16px;text-align:center;color:var(--ink2);font-size:14px}
.dica{font-size:12.5px;color:var(--ink3);text-align:center;margin:-6px 0 0}
.vazio{border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.vazio-ic{font-size:34px}
.vazio span{color:var(--ink2);font-size:14px}

.instalar{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--p50);border:1px dashed var(--p300);font-size:13.5px;color:var(--ink2);
  display:flex;align-items:center;gap:12px}
@media (prefers-color-scheme: dark){.instalar{background:#1c1329}}
.instalar span{flex:1}
.instalar button{border:0;border-radius:10px;background:var(--p700);color:#fff;padding:9px 14px;font-weight:700;flex:none}
.carregando{text-align:center;color:var(--ink2);padding:18vh 0}
.rodape{text-align:center;color:var(--ink3);font-size:12px;margin-top:18px}

@media (min-width:900px){
  main{max-width:1120px;padding:22px 40px 40px}
  #hub{max-width:1080px}
  .topo{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"marca busca conta" "saud saud abas";gap:22px 20px;align-items:end}
  .topo .marca{display:flex;align-self:center}
  .busca{align-self:center;max-width:520px;width:100%;justify-self:center}
  .busca input{height:46px;border-radius:23px;font-size:15px}
  .conta-nome{display:block}
  .conta-box{align-self:center}
  .saud h2{font-size:32px;letter-spacing:-.7px}
  .abas{justify-self:end}
  .aba{flex:none;padding:0 20px;font-size:14px}
  .aba .n{font-size:12px}
  .corpo{gap:22px;margin-top:22px}
  .fix-grade{grid-template-columns:repeat(auto-fill,140px);gap:14px}
  a.fix{padding:16px 8px;border-radius:22px;gap:10px;font-size:13px}
  a.fix:hover{transform:translateY(-2px)}
  a.fix .app-ic{width:60px;height:60px;border-radius:19px}
  .lista{border-radius:26px}
  .lista-cab{display:grid;grid-template-columns:46px 230px minmax(0,1fr) 130px 70px;gap:16px;padding:14px 64px 14px 24px;font-size:11.5px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--linha)}
  .lista-cab span:first-child{grid-column:1 / 3}
  a.linha{display:grid;grid-template-columns:46px 230px minmax(0,1fr) 130px 70px;gap:16px;align-items:center;padding:10px 0 10px 24px;min-height:68px}
  .item:hover{background:var(--linha)}
  a.linha:active{background:transparent}
  .app-ic{width:46px;height:46px}
  .tx{display:contents}
  .tx .nome{font-size:15px;min-width:0}
  .tx .nome i{display:none}
  .tx .desc{font-size:13.5px;white-space:normal}
  .grupo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
  .grupo i{width:8px;height:8px;border-radius:50%;flex:none}
  .abrir{display:block;text-align:right;font-size:13.5px;font-weight:700;color:var(--acento)}
  .estrela{width:48px;height:68px;margin-right:16px}
  .dica{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top" id="cabLogin">
  <div class="marca">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </div>
    <span>HUB</span>
  </div>
</header>

<main>
  <div id="carregando" class="carregando">Abrindo…</div>

  <section id="login" hidden>
    <div class="card">
      <h2>Entrar</h2>
      <p class="lead">Use a matrícula e a chave de acesso que você recebeu. Você entra uma vez neste aparelho.</p>
      <form id="loginForm" autocomplete="off" novalidate>
        <label class="campo" for="loginMat">Matrícula</label>
        <input id="loginMat" class="txt" name="matricula" maxlength="20" autocapitalize="characters" autocomplete="username" spellcheck="false">
        <label class="campo" for="loginChave">Chave de acesso</label>
        <input id="loginChave" class="txt" name="chave" type="password" autocapitalize="none" autocomplete="current-password" spellcheck="false" placeholder="ex.: lago-vento-pedra">
        <label class="ver"><input type="checkbox" id="verChave"> mostrar a chave</label>
        <button type="submit" class="btn" id="loginBtn">Entrar</button>
        <div class="erro" id="loginErro" role="alert" aria-live="polite"></div>
      </form>
      <div class="ajuda">Maiúsculas, acentos, espaços e hífens não contam. Não tem acesso ou perdeu a chave? Fale com o administrador do MAPI.</div>
    </div>
  </section>

  <section id="hub" hidden>
    <div class="topo">
      <div class="marca">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </div>
        <span>HUB</span>
      </div>
      <div class="saud">
        <small id="sub">Centro de Operações</small>
        <h2 id="ola"></h2>
      </div>
      <div class="conta-box">
        <div class="conta-nome"><b id="nomeTopo"></b><span id="perfilTopo"></span></div>
        <button type="button" class="avatar vidro" id="btConta" aria-label="Conta e configurações" aria-haspopup="true" aria-expanded="false" aria-controls="contaPop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0"/></svg>
        </button>
        <div class="conta-pop" id="contaPop" hidden>
          <div><b id="contaNome"></b><div class="meta" id="contaMeta"></div></div>
          <div class="meta" id="situacao"></div>
          <button type="button" id="btAtualizar">Atualizar a lista</button>
          <button type="button" class="sair" id="btSair">Sair deste aparelho</button>
          <div class="meta">HUB <span id="versao"></span></div>
        </div>
      </div>
      <div class="busca" id="buscaBox">
        <label for="busca" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar app</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" placeholder="Buscar app" autocomplete="off" spellcheck="false">
      </div>
      <div class="abas vidro" id="abas" role="tablist" aria-label="Grupos" hidden></div>
    </div>
    <div class="corpo" id="corpo"></div>
  </section>

  <div class="instalar" id="instalar" hidden>
    <span id="instTexto"></span>
    <button type="button" id="instBtn" hidden>Instalar</button>
  </div>
</main>

<script src="cripto.js?v=1.3.0"></script>
<script src="app.js?v=1.3.0"></script>
</body>
</html>
